<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-200 flex flex-col min-h-screen">
    <header class="flex justify-between items-center bg-gray-600 px-6 py-4">
  <span class="text-xl font-bold">LOGO</span>
  <nav>
    <ul class="flex gap-4">
      <li><a href="#">About</a></li>
      <li><a href="#">Works</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</header>

<h1 class="text-3xl font-bold text-center">Member</h1>
<div id ="memberList" class="grid grid-cols-4 gap-4"></div>

 <footer class="bg-gray-800 text-white px-6 py-8">
  <div class="max-w-4xl mx-auto flex items-center justify-between">
    <!-- 左：ロゴ -->
    <a href="./index.html">
      <img src="./images/logo-white.svg" alt="サイトロゴ" class="h-6">
    </a>

<script>
const members=[
{name:"田中太郎", role:"デザイナー",comment:"UIにこだわっています"},
{name:"Maria", role:"leader",comment:"I love you."},
{name:"James", role:"psychopath",comment:"I need you."},
]

const memberList = document.getElementById("memberList");
members.forEach ((member)=> {
const card = document.createElement("div");
card.className = "bg-white rounded-full shadow p-4"

card.innerHTML =`
<h2 class="text-lg font-bold">${member.name}</h2>
<p class= "text-sm text-blue-500">${member.role}</p>
<p class="text-sm text-gray-300">${member.comment}</p>
`;

memberList.appendChild(card);
});

</script>
</main>
</body>
</html>
