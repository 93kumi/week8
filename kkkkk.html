<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新しいサークル</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Shippori Mincho', serif;
  }
</style>

<body class="bg-gradient-to-tr from-pink-100 via-purple-100 to-cyan-100">
    <h1 class="text-4xl font-bold text-center text-pink-400 p-4">マーメイドサークルメンバー紹介！あなたも私たちみたいにならない？？</h1>
<div id="memberList" class=" grid gap-4 p-8 md:grid-cols-3 w-full"></div>

<script>
const members = [
        {name: "佐藤 茂", role:"泳ぐのが一番上品で可憐なお嬢", comment:"皆さん私を信じるのよ💕"},
        {name: "松平 忠孝", role:"水上で一番の妄想癖", comment:"願うと願いはいつかかなうのっ！知ってた？"},
        {name: "勝沼 小五郎", role:"岩の上のプリンセスもどき", comment:"人間である君を見ただけで鼓動がおかしくなるのはなぜなのかしら？"},
];

    const memberList = document.getElementById("memberList");

    members.forEach((member) => {
        const card = document.createElement("div");
        card.className = "bg-emerald-100 rounded-full shadow p-4 hover:lg hover:scale-105 transition;"
    
    card.innerHTML = `
        <h2 class="text-lg font-bold text-emerald-800">${member.name}</h2>
        <p class="text-emerald-500">${member.role}</p>
        <p class="text-pink-500">${member.comment}</p>
    `;



memberList.appendChild(card);
})



</script>
</body>
</html>
